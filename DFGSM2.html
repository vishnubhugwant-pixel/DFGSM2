    <script>
        window.onerror = function (message, source, lineno, colno, error) {
            const div = document.createElement('div');
            div.style.position = 'fixed';
            div.style.top = '0';
            div.style.left = '0';
            div.style.width = '100%';
            div.style.zIndex = '99999';
            div.style.background = 'red';
            div.style.color = 'white';
            div.style.padding = '15px';
            div.style.fontFamily = 'monospace';
            div.style.whiteSpace = 'pre-wrap';
            div.innerHTML = '🚨 Error: ' + message + '\nAt: ' + source + ':' + lineno + ':' + colno + '\nStack: ' + (error ? error.stack : 'No stack');
            document.body.appendChild(div);
            return false;
        };
        window.onunhandledrejection = function (event) {
            const div = document.createElement('div');
            div.style.position = 'fixed';
            div.style.top = '0';
            div.style.left = '0';
            div.style.width = '100%';
            div.style.zIndex = '99999';
            div.style.background = 'orange';
            div.style.color = 'white';
            div.style.padding = '15px';
            div.style.fontFamily = 'monospace';
            div.style.whiteSpace = 'pre-wrap';
            div.innerHTML = '🚨 Unhandled Promise Rejection: ' + event.reason;
            document.body.appendChild(div);
        };
    </script>

            let polyvalenceRaw = 0;

                if (courseQcms.some(q => progress[q.id] !== undefined)) {
                    polyvalenceRaw++;

            // Vitesse (Pression) : pourcentage de QCM tentés sous la pression du chronomètre
            const vitesseRaw = enduranceRaw > 0 ? (pressureScore / enduranceRaw) * 100 : 0;

            const potentielRaw = totalQcmsInDb - savoirRaw;

            // Progression globale au lieu de Potentiel (qui baissait)

            // 2. Conversion en Niveaux (0.2 à 5.0 pour que le Radar grandisse de façon fluide)
            const calcContinuous = (val, t) => {
                if (val >= t[4]) return 5;
                if (val >= t[3]) return 4 + (val - t[3]) / (t[4] - t[3]);
                if (val >= t[2]) return 3 + (val - t[2]) / (t[3] - t[2]);
                if (val >= t[1]) return 2 + (val - t[1]) / (t[2] - t[1]);
                if (val >= t[0]) return 1 + (val - t[0]) / (t[1] - t[0]);
                return 0.2 + 0.8 * (val / t[0]); // Ne tombe jamais à 0 complet
            };

            const getLetter = (val, t) => {
                if (val >= t[4]) return 'A';
                if (val >= t[3]) return 'B';
                if (val >= t[2]) return 'C';
                if (val >= t[1]) return 'D';
                return 'E';

            const vitesseT = [5, 10, 15, 20, 25];
            const polyT = [2, 5, 10, 15, 25];
            const endT = [30, 150, 400, 800, 1200];
            const precT = [30, 50, 70, 85, 95];
            const progT = [5, 15, 30, 50, 80];

            const stats = [
                { name: 'Savoir', value: calcContinuous(savoirRaw, savoirT), letter: getLetter(savoirRaw, savoirT) },
                { name: 'Vitesse', value: calcContinuous(vitesseRaw, vitesseT), letter: getLetter(vitesseRaw, vitesseT) },
                { name: 'Polyvalence', value: calcContinuous(polyvalenceRaw, polyT), letter: getLetter(polyvalenceRaw, polyT) },

                const r = (value / 5) * radius;
                const theta = index * angleStep - Math.PI / 2;
                return `${center + r * Math.cos(theta)},${center + r * Math.sin(theta)}`;
            };

            const polygonPoints = stats.map((stat, i) => getPoint(stat.value, i)).join(' ');

            // Lignes de fond
            const backgroundPolygons = [1, 2, 3, 4, 5].map(level => {
                return stats.map((_, i) => getPoint(level, i)).join(' ');
            });

            return (

                                <polygon key={i} points={points} fill="none" stroke="rgba(255,255,255,0.1)" strokeWidth="1" />
                            ))}

                            {/* Axes */}
                            {stats.map((_, i) => (
                                <line
                                    key={i}
                                    x1={center} y1={center}
                                    x2={center + radius * Math.cos(i * angleStep - Math.PI / 2)}
                                    y2={center + radius * Math.sin(i * angleStep - Math.PI / 2)}
                                    stroke="rgba(255,255,255,0.1)" strokeWidth="1"
                                />
                            ))}

                                    <stop offset="100%" stopColor="rgba(225, 29, 72, 0.5)" />
                                </linearGradient>
                            </defs>
                            <polygon
                                points={polygonPoints}
                                fill="url(#radarGradient)"
                                stroke="#f59e0b"
                                strokeWidth="3"
                                className="drop-shadow-[0_0_15px_rgba(245,158,11,0.6)]"
                            />

                            {/* Labels */}
                            {stats.map((stat, i) => {
                                const labelR = radius + 35;
                                const theta = i * angleStep - Math.PI / 2;
                                const x = center + labelR * Math.cos(theta);
                                const y = center + labelR * Math.sin(theta);

                                // Couleur des lettres en fonction du niveau
                                let letterColor = "text-slate-400";
                                if (stat.letter === 'A') letterColor = "fill-amber-400 font-black drop-shadow-[0_0_8px_rgba(245,158,11,0.8)]";

                                        <text x={x} y={y - 8}>{stat.name}</text>

                                    </g>
                                );
                            })}

                                    <motion.div
                                        className="bg-white w-5 h-5 rounded-full shadow-md shrink-0 block"
                                        animate={{ x: isTimerEnabled ? 24 : 0 }}
                                        transition={{ type: "spring", stiffness: 500, damping: 30 }}
                                    />
                                </button>
                                <span className={`text-sm font-medium transition-all ${isTimerEnabled ? 'text-rose-400 font-bold' : 'text-slate-500'}`}>Chronomètre (Pression)</span>
                            </div>



                            <button onClick={onShowProtocol} className="px-6 py-3 bg-rose-900/30 text-rose-400 border border-rose-500/50 rounded-xl font-bold uppercase tracking-widest hover:bg-rose-600/40 transition-colors shadow-[0_0_15px_rgba(225,29,72,0.3)] animate-pulse">

                            <span>🏛️ Semestre 3 (DFGSM2)</span>
                        </div>
                        <h3 className="text-xl font-serif font-bold text-slate-100 tracking-wider uppercase">Unités d'Enseignement (UE)</h3>
                        <p className="text-xs text-slate-400 tracking-wider mt-1">Sélectionnez une UE pour accéder à ses modules et séances de cours</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 justify-center max-w-6xl mx-auto">

                        {COURSES_DATA.map(course => {
                            let diffColor = "bg-amber-500/15 text-amber-300 border-amber-500/30";
                            if (course.difficulte === "Très difficile" || course.difficulte === "Difficile" || course.difficulte === "Majeure") {
                                diffColor = "bg-rose-600/20 text-rose-300 border-rose-600/30 shadow-[0_0_12px_rgba(225,29,72,0.15)]";
                            } else if (course.difficulte === "Facile" || course.difficulte === "Pratique") {
                                diffColor = "bg-emerald-600/20 text-emerald-300 border-emerald-600/30";
                            }

                            const allQuestions = (ALL_QCM_DATA && ALL_QCM_DATA[course.code]) || (window.ALL_QCM_DATA && window.ALL_QCM_DATA[course.code]) || [];
                            const correctCount = allQuestions.filter(q => progress && progress[q.id] === true).length;
                            const pct = allQuestions.length > 0 ? Math.round((correctCount / allQuestions.length) * 100) : 0;

                            let pctColor = "text-slate-400 bg-white/5";
                            if (pct >= 80) pctColor = "text-emerald-400 bg-emerald-500/10";
                            else if (pct >= 50) pctColor = "text-amber-400 bg-amber-500/10";

                            const isSpecial = course.titre.includes("Annales") || course.titre.includes("Colle");

                            return (
                                <motion.div
                                    key={course.code}
                                    whileHover={{ scale: 1.03, y: -5, boxShadow: isSpecial ? '0 15px 30px -10px rgba(245, 158, 11, 0.15)' : undefined }}
                                    onClick={() => onSelectCourse(course)}
                                    className="glass-card p-6 rounded-[2rem] cursor-pointer group flex flex-col justify-between"
                                    style={isSpecial ? {
                                        borderColor: 'rgba(245, 158, 11, 0.25)',
                                        background: 'linear-gradient(145deg, rgba(245, 158, 11, 0.04) 0%, rgba(255, 255, 255, 0.01) 100%)'
                                    } : {}}
                                >
                                    <div>
                                        <div className="flex justify-between items-start mb-4">
                                            <span className={`whitespace-nowrap text-xs font-semibold px-3 py-1 rounded-full border ${diffColor}`}>
                                                {course.ects ? `${course.ects} ECTS • ` : ''}{course.difficulte}
                                            </span>
                                            <div className="flex gap-2 items-center">
                                                <span className={`text-xs font-bold px-2 py-1 rounded-md ${pctColor}`}>{pct}% acquis</span>
                                                <SparklesIcon style={{ color: pct === 0 ? '#475569' : `rgb(245, ${158 + (pct / 100) * 60}, ${11 + (pct / 100) * 80})`, opacity: pct === 0 ? 0.3 : 0.5 + (pct / 100) * 0.5, filter: pct === 0 ? 'none' : `drop-shadow(0 0 ${10 + (pct / 100) * 30}px rgba(250, 200, 50, ${0.4 + (pct / 100) * 0.6}))`, transform: `scale(${pct === 0 ? 0.8 : 0.9 + (pct / 100) * 0.35})`, transition: 'all 0.5s cubic-bezier(0.4, 0, 0.2, 1)' }} className="" />
                                            </div>
                                        </div>
                                        <h3 className="text-xl font-serif font-bold mb-3 text-slate-100 group-hover:text-ghibli-accent transition-colors leading-snug">{course.titre}</h3>
                                    </div>
                                    <div className="pt-3 flex justify-between items-center text-[10px] uppercase text-slate-400 border-t border-white/10 mt-6">
                                        {course.volumeHoraire ? (
                                            <span className="font-mono text-slate-300 bg-white/5 px-2.5 py-1 rounded-md border border-white/10 flex items-center gap-1.5">
                                                <span>⏱</span>
                                                <span>{course.volumeHoraire}</span>
                                            </span>
                                        ) : (
                                            <span className="font-mono">{course.code}</span>
                                        )}
                                        <span className="text-ghibli-accent font-bold bg-amber-500/10 px-2.5 py-1 rounded-md border border-amber-500/20">{course.totalQcm} QCM</span>
                                    </div>
                                </motion.div>
                            )
                        })}
                    </div>
                    <Footer />
                </motion.div>
            );
        };

        const Session = ({ course, questionsSubset, onFinish, onBack, hasTimer, onUpdateProgress, pinnedQuestions = [], togglePin }) => {
            const [sessionQuestions, setSessionQuestions] = useState([]);
            useEffect(() => {
                let qs = [...questionsSubset];
                setSessionQuestions(qs);
            }, [questionsSubset, course.code]);

            const [currentQIndex, setCurrentQIndex] = useState(0);
            const [history, setHistory] = useState({});
            const [timeLeft, setTimeLeft] = useState(60);

            const currentHistory = history[currentQIndex] || { selectedOptions: [], isValidated: false, isCorrect: false };
            const selectedOptions = currentHistory.selectedOptions;
            const isValidated = currentHistory.isValidated;
            const score = Object.values(history).filter(h => h.isCorrect).length;

            useEffect(() => {
                if (!hasTimer || isValidated || sessionQuestions.length === 0) return;
                if (timeLeft === 0) { validateQuestion(); return; }
                const timer = setInterval(() => setTimeLeft(prev => prev - 1), 1000);
                return () => clearInterval(timer);
            }, [timeLeft, hasTimer, isValidated, sessionQuestions]);

            if (sessionQuestions.length === 0) return <div className="text-white text-center mt-20 text-2xl font-serif italic">Ouverture du dossier...</div>;

            const question = sessionQuestions[currentQIndex];
            const progress = (currentQIndex / sessionQuestions.length) * 100;

            const handleOptionClick = (key) => {
                if (isValidated) return;
                setHistory(prev => {
                    const current = prev[currentQIndex] || { selectedOptions: [], isValidated: false, isCorrect: false };
                    const newOptions = current.selectedOptions.includes(key)
                        ? current.selectedOptions.filter(o => o !== key)
                        : [...current.selectedOptions, key];
                    return { ...prev, [currentQIndex]: { ...current, selectedOptions: newOptions } };
                });
            };

            const validateQuestion = () => {
                if (selectedOptions.length === 0 && timeLeft > 0) return;
                const isCorrect = selectedOptions.length === question.correctAnswers.length && selectedOptions.every(val => question.correctAnswers.includes(val));

                setHistory(prev => {
                    const current = prev[currentQIndex] || { selectedOptions: [], isValidated: false, isCorrect: false };
                    return { ...prev, [currentQIndex]: { ...current, isValidated: true, isCorrect } };
                });

                if (onUpdateProgress) onUpdateProgress(question.id, isCorrect);
            };

            const nextQuestion = () => {
                if (currentQIndex < sessionQuestions.length - 1) {
                    setCurrentQIndex(currentQIndex + 1);
                    setTimeLeft(60);
                } else {
                    onFinish(score, sessionQuestions.length);
                }
            };

            const prevQuestion = () => {
                if (currentQIndex > 0) {
                    setCurrentQIndex(currentQIndex - 1);
                }
            };

            return (
                <motion.div initial={{ opacity: 0, x: 50 }} animate={{ opacity: 1, x: 0 }} exit={{ opacity: 0, x: -50 }} className="max-w-4xl mx-auto py-8 px-4 flex flex-col min-h-screen">

                    <div className="w-full h-1.5 bg-white/10 rounded-full overflow-hidden mb-4">
                        <motion.div className="h-full bg-gradient-to-r from-amber-400 to-orange-500" initial={{ width: 0 }} animate={{ width: `${progress}%` }} />
                    </div>

                    {hasTimer && (
                        <div className="w-full mb-6 flex items-center gap-3">
                            <span className="text-sm font-mono text-slate-400">⏱</span>
                            <div className="flex-1 h-1.5 bg-white/5 rounded-full overflow-hidden relative">
                                <motion.div className={`absolute top-0 left-0 bottom-0 ${timeLeft > 15 ? 'bg-cyan-400' : 'bg-rose-500'}`} animate={{ width: `${(timeLeft / 60) * 100}%` }} transition={{ duration: 0.5, ease: "linear" }} />
                            </div>
                            <span className={`text-sm font-mono font-bold w-6 text-right ${timeLeft <= 10 ? 'text-rose-400 animate-pulse' : 'text-slate-300'}`}>{timeLeft}s</span>
                        </div>

                    const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 1000, colors: ['#fbbf24', '#f43f5e', '#34d399', '#60a5fa'] };

                        const timeLeft = animationEnd - Date.now();

                                    <path d="M 100 215 C 140 215, 185 160, 185 60" stroke="#F1E3C3" strokeWidth="2" fill="none" strokeLinecap="round" />

                                    {/* Leaves */}
                                    <g fill="#F1E3C3">
                                        {leavesLeftOuter.map((l, i) => <path key={`llo-${i}`} d={leafPath} transform={`translate(${l.x}, ${l.y}) rotate(${l.a}) scale(0.9)`} />)}
                                        {leavesLeftInner.map((l, i) => <path key={`lli-${i}`} d={leafPath} transform={`translate(${l.x}, ${l.y}) rotate(${l.a}) scale(0.9)`} />)}
                                        {allLeavesRightOuter.map((l, i) => <path key={`lro-${i}`} d={leafPath} transform={`translate(${l.x}, ${l.y}) rotate(${l.a}) scale(0.9)`} />)}
                                        {allLeavesRightInner.map((l, i) => <path key={`lri-${i}`} d={leafPath} transform={`translate(${l.x}, ${l.y}) rotate(${l.a}) scale(0.9)`} />)}
                                        {/* Bottom cross ribbon */}
                                        <path d="M 90 208 L 110 223 L 105 228 L 85 213 Z" />
                                        <path d="M 110 208 L 90 223 L 95 228 L 115 213 Z" />
                                    </g>

                                    {/* Outer Shield */}
                                    <path d="M 100 200 C 100 200, 25 160, 32 75 C 55 75, 75 60, 100 52 C 125 60, 145 75, 168 75 C 175 160, 100 200, 100 200 Z" stroke="#F1E3C3" strokeWidth="3" fill="none" />
                                    {/* Inner Shield */}
                                    <path d="M 100 188 C 100 188, 35 152, 42 82 C 60 82, 78 68, 100 60 C 122 68, 140 82, 158 82 C 165 152, 100 188, 100 188 Z" stroke="#F1E3C3" strokeWidth="1.5" fill="none" />

                                    {/* Crown */}
                                    <path d="M 75 30 L 78 12 L 88 22 L 100 5 L 112 22 L 122 12 L 125 30 Z" fill="#F1E3C3" stroke="#F1E3C3" strokeWidth="1" strokeLinejoin="round" />
                                    <rect x="75" y="33" width="50" height="2.5" fill="#F1E3C3" rx="1" />
                                    <circle cx="78" cy="10" r="2.5" fill="#F1E3C3" />
                                    <circle cx="88" cy="20" r="2.5" fill="#F1E3C3" />
                                    <circle cx="100" cy="3" r="3" fill="#F1E3C3" />
                                    <circle cx="112" cy="20" r="2.5" fill="#F1E3C3" />
                                    <circle cx="122" cy="10" r="2.5" fill="#F1E3C3" />

                                    {/* Stars Arc */}
                                    <g fill="#F1E3C3">
                                        <polygon points="100,38 101.5,41.5 105,41.5 102,44 103.5,47.5 100,45.5 96.5,47.5 98,44 95,41.5 98.5,41.5" />
                                        <polygon points="85,42 86.5,45.5 90,45.5 87,48 88.5,51.5 85,49.5 81.5,51.5 83,48 80,45.5 83.5,45.5" />
                                        <polygon points="72,48 73.5,51.5 77,51.5 74,54 75.5,57.5 72,55.5 68.5,57.5 70,54 67,51.5 70.5,51.5" />
                                        <polygon points="115,42 116.5,45.5 120,45.5 117,48 118.5,51.5 115,49.5 111.5,51.5 113,48 110,45.5 113.5,45.5" />
                                        <polygon points="128,48 129.5,51.5 133,51.5 130,54 131.5,57.5 128,55.5 124.5,57.5 126,54 123,51.5 126.5,51.5" />
                                    </g>
                                    {/* V */}
                                    <text x="100" y="145" fontFamily="'Times New Roman', Times, serif" fontSize="75" fill="#F1E3C3" textAnchor="middle" fontWeight="bold">V</text>

                                    {/* 2026 */}
                                    <text x="100" y="165" fontFamily="sans-serif" fontSize="11" fill="#F1E3C3" textAnchor="middle" letterSpacing="1.5" fontWeight="600">2026</text>
                                </svg>
                            </div>
                            <h1 className="text-3xl font-serif font-bold text-amber-500 text-center tracking-wide magic-text">Le Grimoire Médical</h1>
                            <p className="text-slate-400 text-xs mt-2 uppercase tracking-[0.2em] font-medium">UFR Santé • DFGSM2</p>
                        </div>




                        <form onSubmit={handleSubmit} className="space-y-5">
                            <div>
                                <label className="block text-slate-300 text-xs font-semibold uppercase tracking-wider mb-2" htmlFor="email">Adresse E-mail</label>
                                <div className="relative">
                                    <span className="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="20" height="16" x="2" y="4" rx="2" /><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" /></svg>
                                    </span>
                                    <input
                                        className="w-full pl-11 pr-4 py-3 bg-slate-950/40 border border-white/10 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all text-sm"
                                        type="email"
                                        id="email"
                                        value={email}
                                        onChange={(e) => setEmail(e.target.value)}
                                        placeholder="etudiant@ufr-sante.fr"
                                        disabled={loading}
                                    />
                                </div>
                            </div>

                            <div>
                                <label className="block text-slate-300 text-xs font-semibold uppercase tracking-wider mb-2" htmlFor="password">Mot de passe</label>
                                <div className="relative">
                                    <span className="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></svg>
                                    </span>
                                    <input
                                        className="w-full pl-11 pr-4 py-3 bg-slate-950/40 border border-white/10 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all text-sm"
                                        type="password"
                                        id="password"
                                        value={password}
                                        onChange={(e) => setPassword(e.target.value)}
                                        placeholder="••••••••"
                                        disabled={loading}
                                    />
                                </div>
                            </div>

                            <div className="flex items-center justify-between">
                                <label className="flex items-center gap-2 cursor-pointer text-xs text-slate-400 hover:text-slate-300">
                                    <input
                                        type="checkbox"
                                        checked={rememberMe}
                                        onChange={(e) => setRememberMe(e.target.checked)}
                                        className="rounded bg-slate-950/40 border-white/10 text-amber-500 focus:ring-0 focus:ring-offset-0"
                                    />
                                    Enregistrer la connexion
                                </label>
                            </div>

                            <div className="space-y-2">
                                <label className="block text-slate-300 text-xs font-semibold uppercase tracking-wider mb-2">Division d'Entraînement</label>
                                <div className="grid grid-cols-2 gap-2">
                                    {[
                                        { id: 1, name: "Groupe 1", desc: "DFGSM2 — Groupe A", color: "#be123c" },
                                        { id: 2, name: "Groupe 2", desc: "DFGSM2 — Groupe B", color: "#854d0e" },
                                        { id: 3, name: "Groupe 3", desc: "DFGSM2 — Groupe C", color: "#ea580c" },
                                        { id: 4, name: "Groupe 4", desc: "DFGSM2 — Promotion Complète", color: "#22c55e" },
                                    ].map((g) => {
                                        const isSelected = selectedGroup === g.id;
                                        return (
                                            <div
                                                key={g.id}
                                                onClick={() => {
                                                    onSelectGroup(g.id);
                                                    localStorage.setItem('grimoire_group', g.id);
                                                }}
                                                className={`p-3 rounded-xl border cursor-pointer text-left transition-all ${isSelected ? 'bg-slate-900/60' : 'bg-slate-950/40 border-white/10 hover:border-white/20'}`}
                                                style={isSelected ? { borderColor: g.color } : {}}
                                            >
                                                <div className="font-bold text-xs flex items-center justify-between" style={{ color: isSelected ? g.color : '#f8fafc' }}>
                                                    {g.name}
                                                    {isSelected && <span className="w-2 h-2 rounded-full" style={{ backgroundColor: g.color }}></span>}
                                                </div>
                                                <div className="text-[10px] text-slate-400 mt-1 leading-tight">{g.desc}</div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                            {error && (
                                <motion.div
                                    initial={{ opacity: 0, y: -10 }}
                                    animate={{ opacity: 1, y: 0 }}
                                    className="p-4 bg-rose-950/40 border border-rose-500/30 text-rose-200 text-xs md:text-sm rounded-xl flex gap-2.5 items-start"
                                >
                                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="shrink-0 text-rose-400 mt-0.5"><circle cx="12" cy="12" r="10" /><line x1="12" x2="12" y1="8" y2="12" /><line x1="12" x2="12.01" y1="16" y2="16" /></svg>
                                    <div>{error}</div>
                                </motion.div>
                            )}

                            <button
                                type="submit"
                                disabled={loading}
                                className="w-full py-3.5 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 active:scale-[0.98] text-slate-950 font-bold uppercase tracking-wider rounded-xl transition-all text-sm shadow-lg shadow-amber-500/20 flex justify-center items-center gap-2"
                            >
                                {loading ? (
                                    <>
                                        <svg className="animate-spin h-5 w-5 text-slate-950" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                            <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                            <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                        </svg>
                                        Connexion en cours...
                                    </>
                                ) : "Entrer dans le Grimoire"}
                            </button>
                        </form>
                    </motion.div>

                    <div className="mt-8 text-center max-w-xs">
                        <p className="text-slate-500 text-xs leading-relaxed mb-4">
                            Cet espace est réservé aux étudiants de DFGSM2. Si vous n'avez pas reçu vos accès, contactez l'administration de l'UFR Santé.
                        </p>
                        <div className="flex flex-col gap-2 bg-slate-950/30 border border-white/5 rounded-2xl p-4 backdrop-blur-sm">
                            <span className="text-[10px] uppercase font-bold tracking-wider text-slate-400">L'Ordre de Vishnu • UFR Santé</span>
                            <div className="flex flex-col gap-1 text-xs text-slate-300">
                                <span className="text-slate-400 text-center italic">Plateforme de révision DFGSM2</span>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('dashboard');
            const [showStats, setShowStats] = useState(false);
            const [activeCourse, setActiveCourse] = useState(null);
            const [activeQuestions, setActiveQuestions] = useState([]);
            const [partTitle, setPartTitle] = useState("");
            const [finalScore, setFinalScore] = useState({ score: 0, total: 0 });
            const [isTimerEnabled, setIsTimerEnabled] = useState(false);
            const [progress, setProgress] = useState(() => {
                try {
                    const saved = localStorage.getItem('grimoire_progress');
                    return saved ? JSON.parse(saved) : {};
                } catch (e) { return {}; }
            });

            const [pinnedQuestions, setPinnedQuestions] = useState(() => {
                try {
                    const saved = localStorage.getItem('grimoire_pinned');
                    return saved ? JSON.parse(saved) : [];
                } catch (e) { return []; }
            });

            const togglePin = (questionId) => {
                setPinnedQuestions(prev => {
                    const next = prev.includes(questionId) ? prev.filter(id => id !== questionId) : [...prev, questionId];
                    localStorage.setItem('grimoire_pinned', JSON.stringify(next));
                    return next;
                });
            };

            const [pressureScore, setPressureScore] = useState(() => {
                return parseInt(localStorage.getItem('grimoire_pressure_score') || '0', 10);
            });

            const handleProgressUpdate = (questionId, isCorrect) => {
                if (isTimerEnabled) {
                    setPressureScore(prev => {
                        const next = prev + 1;
                        localStorage.setItem('grimoire_pressure_score', next.toString());
                        return next;
                    });
                }
                setProgress(prev => {
                    const next = { ...prev, [questionId]: isCorrect };
                    localStorage.setItem('grimoire_progress', JSON.stringify(next));
                    return next;
                });
            };

            const startCimetiere = () => {
                let wrongQuestions = [];
                Object.values(ALL_QCM_DATA).forEach(courseQcms => {
                    courseQcms.forEach(q => {
                        if (progress[q.id] === false) {
                            wrongQuestions.push(q);
                        }
                    });
                });

                if (wrongQuestions.length === 0) {
                    alert("Bravo ! Vous n'avez aucune erreur dans le cimetière. Vous maîtrisez tout ! 🎉");
                    return;
                }

                // On garde les questions dans l'ordre d'origine
                // wrongQuestions.sort(() => Math.random() - 0.5);

                setActiveCourse({ code: "CIMETIERE", titre: "💀 Cimetière des Erreurs", difficulte: "Adaptative", totalQcm: wrongQuestions.length });
                setPartTitle("Révision Ciblée");
                setActiveQuestions(wrongQuestions);
                setView('session');
            };

            const [selectedGroup, setSelectedGroup] = useState(() => {
                return parseInt(localStorage.getItem('grimoire_group') || '4', 10);
            });

            useEffect(() => {
                let classes = [];
                if (isTimerEnabled) {
                    classes.push('pressure-mode');
                    if (selectedGroup === 1) classes.push('theme-g1-zen');      // Rouge -> Complémentaire Vert d'eau/Teal en Pression
                    else if (selectedGroup === 2) classes.push('theme-g2-zen'); // Ambre -> Complémentaire Violet/Indigo en Pression
                    else if (selectedGroup === 3) classes.push('theme-g3-zen'); // Bleu -> Complémentaire Orange/Rust en Pression
                    else if (selectedGroup === 4) classes.push('theme-g4-zen'); // Original Pression G4
                } else {
                    if (selectedGroup === 1) classes.push('theme-g1');
                    else if (selectedGroup === 2) classes.push('theme-g2');
                    else if (selectedGroup === 3) classes.push('theme-g3');
                    else if (selectedGroup === 4) classes.push('theme-g4'); // Original Zen G4
                }
                document.body.className = classes.join(' ');
            }, [isTimerEnabled, selectedGroup]);

            // === ÉTAT DE SESSION ET AUTHENTIFICATION ===
            const [currentUser, setCurrentUser] = useState(null);
            const [authLoading, setAuthLoading] = useState(true);

            useEffect(() => {
                if (isDemoMode) {
                    const savedUser = localStorage.getItem('grimoire_demo_user');
                    if (savedUser) {
                        try {
                            setCurrentUser(JSON.parse(savedUser));
                        } catch (e) {
                            localStorage.removeItem('grimoire_demo_user');
                        }
                    }
                    setAuthLoading(false);
                } else {
                    const unsubscribe = auth.onAuthStateChanged((user) => {
                        setCurrentUser(user);
                        setAuthLoading(false);
                    });
                    return () => unsubscribe();
                }
            }, []);

            const handleLoginSuccess = (user) => {
                setCurrentUser(user);
                if (isDemoMode) {
                    localStorage.setItem('grimoire_demo_user', JSON.stringify(user));
                }
            };

            const handleLogout = async () => {
                if (isDemoMode) {
                    localStorage.removeItem('grimoire_demo_user');
                    setCurrentUser(null);
                } else {
                    try {
                        await auth.signOut();
                        setCurrentUser(null);
                    } catch (e) {
                        console.error("Sign out error:", e);
                    }
                }
                setView('dashboard');
            };

            // === SYSTÈME DE PRÉSENCE EN TEMPS RÉEL (FIRESTORE) ===
            const [rawOnlineUsers, setRawOnlineUsers] = useState([]);

            // 1. Écouter la liste globale des connectés
            useEffect(() => {
                if (isDemoMode) {
                    const demoList = [];
                    Object.keys(CONNECTED_STUDENTS).forEach(g => {
                        CONNECTED_STUDENTS[g].forEach(student => {
                            demoList.push({
                                uid: student.name,
                                email: student.name.toLowerCase().replace(' ', '.') + "@ufr-sante.fr",
                                name: student.name,
                                group: parseInt(g, 10),
                                status: student.status,
                                lastActive: new Date()
                            });
                        });
                    });
                    setRawOnlineUsers(demoList);
                    return;
                }

                if (!db) return;

                const unsubscribe = db.collection('online_users')
                    .onSnapshot((snapshot) => {
                        const users = [];
                        snapshot.forEach(doc => {
                            users.push(doc.data());
                        });
                        setRawOnlineUsers(users);
                    }, (error) => {
                        console.error("Error listening to online users:", error);
                    });

                return () => unsubscribe();
            }, [currentUser, isDemoMode]);

            // 2. Publier sa propre présence
            useEffect(() => {
                if (isDemoMode || !db || !currentUser) return;

                const updatePresence = async () => {
                    try {
                        const name = currentUser.displayName || currentUser.email.split('@')[0].split('.')[0].replace(/^\w/, c => c.toUpperCase());
                        let statusText = "Sur le Dashboard";
                        if (view === 'session' && activeCourse) {
                            statusText = `Révisant : ${activeCourse.titre}`;
                        } else if (view === 'carnet') {
                            statusText = "Dans son Carnet d'Erreurs";
                        } else if (view === 'submenu' && activeCourse) {
                            statusText = `Consulte : ${activeCourse.titre}`;
                        }

                        await db.collection('online_users').doc(currentUser.uid).set({
                            uid: currentUser.uid,
                            email: currentUser.email,
                            name: name,
                            group: selectedGroup,
                            status: statusText,
                            lastActive: firebase.firestore.FieldValue.serverTimestamp()
                        }, { merge: true });
                    } catch (e) {
                        console.error("Error writing presence:", e);
                    }
                };

                updatePresence();
                const interval = setInterval(updatePresence, 30000);

                return () => {
                    clearInterval(interval);
                    db.collection('online_users').doc(currentUser.uid).delete().catch(err => { });
                };
            }, [currentUser, selectedGroup, view, activeCourse, isDemoMode]);

            if (authLoading) {
                return (
                    <div className="min-h-screen flex justify-center items-center bg-[#0a0a1a]">
                        <svg className="animate-spin h-10 w-10 text-amber-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                            <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </div>
                );
            }

            if (!currentUser) {
                return <LoginScreen selectedGroup={selectedGroup} onSelectGroup={setSelectedGroup} onLoginSuccess={handleLoginSuccess} />;
            }

            return (
                <div className="relative overflow-x-hidden">
                    <VishnuLogo onClick={() => setView('dashboard')} />
                    {view === 'dashboard' && (
                        <div className="absolute top-4 right-4 md:top-8 md:right-8 z-40 flex flex-col items-end gap-2">
                            <button onClick={() => setShowStats(true)} className="flex items-center gap-2 px-4 py-2 bg-slate-900/60 hover:bg-slate-800/80 text-slate-300 hover:text-white rounded-full border border-white/10 shadow-lg backdrop-blur-sm transition-all font-medium text-sm">
                                📊 Statistiques
                            </button>
                            <button onClick={startCimetiere} className="flex items-center gap-2 px-4 py-2 bg-rose-900/60 hover:bg-rose-800/80 text-rose-200 rounded-full border border-rose-500/30 shadow-lg backdrop-blur-sm transition-all font-medium text-sm">
                                💀 Cimetière des Erreurs
                            </button>
                            <button onClick={() => setView('carnet')} className="flex items-center gap-2 px-4 py-2 bg-amber-900/60 hover:bg-amber-800/80 text-amber-200 rounded-full border border-amber-500/30 shadow-lg backdrop-blur-sm transition-all font-medium text-sm">
                                📕 Carnet d'Erreurs
                            </button>
                            <button onClick={handleLogout} className="flex items-center gap-2 px-4 py-2 bg-slate-900/60 hover:bg-slate-800/80 text-slate-300 hover:text-white rounded-full border border-white/10 shadow-lg backdrop-blur-sm transition-all font-medium text-sm" title="Se déconnecter de la plateforme">
                                🚪 Déconnexion
                            </button>
                        </div>
                    )}



                    <AnimatePresence>
                        {showStats && <StatistiquesModal progress={progress} pressureScore={pressureScore} onClose={() => setShowStats(false)} />}
                    </AnimatePresence>

                    <AnimatePresence mode="wait">
                        {view === 'dashboard' && (
                            <Dashboard
                                key="dash"
                                progress={progress}
                                onSelectCourse={c => { setActiveCourse(c); setView('submenu'); }}
                                isTimerEnabled={isTimerEnabled}
                                onToggleTimer={() => setIsTimerEnabled(!isTimerEnabled)}
                                onShowProtocol={() => setView('protocol')}
                                onShowStats={() => setShowStats(true)}
                                isAdmin={currentUser && (currentUser.email.includes('admin') || currentUser.isAdmin)}
                                selectedGroup={selectedGroup}
                                onSelectGroup={(g) => {
                                    setSelectedGroup(g);
                                    localStorage.setItem('grimoire_group', g);
                                }}
                                onlineUsers={rawOnlineUsers.filter(u => {
                                    if (!u.lastActive) return true;
                                    const time = u.lastActive.toDate ? u.lastActive.toDate().getTime() : new Date(u.lastActive).getTime();
                                    return time > (Date.now() - 120000);
                                })}
                            />
                        )}
                        {view === 'protocol' && <Protocol key="protocol" onBack={() => setView('dashboard')} />}
                        {view === 'carnet' && <CarnetErreurs key="carnet" pinnedQuestions={pinnedQuestions} togglePin={togglePin} onBack={() => setView('dashboard')} />}
                        {view === 'submenu' && <SubMenu key="sub" course={activeCourse} progress={progress} onBack={() => setView('dashboard')} onSelectPart={(title, qs) => { setPartTitle(title); setActiveQuestions(qs); setView('session'); }} />}
                        {view === 'session' && <Session key="sess" course={{ ...activeCourse, titre: partTitle }} questionsSubset={activeQuestions} hasTimer={isTimerEnabled} onBack={() => setView(activeCourse.code === 'CIMETIERE' ? 'dashboard' : 'submenu')} onUpdateProgress={handleProgressUpdate} onFinish={(s, t) => { setFinalScore({ score: s, total: t }); setView('bilan'); }} pinnedQuestions={pinnedQuestions} togglePin={togglePin} />}
                        {view === 'bilan' && <Bilan key="bilan" score={finalScore.score} total={finalScore.total} onRestart={() => setView(activeCourse.code === 'CIMETIERE' ? 'dashboard' : 'submenu')} />}
                    </AnimatePresence>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
